<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  CAREER_GROUPS ||--o{ ROLES : contains
  ROLES ||--o{ HISTORICAL_TITLES : maps_from
  CAREER_GROUPS ||--o{ SOC_CODES : includes
  ROLES }o--|| DHRM_PAY_BANDS : "assigned to"
  DHRM_PAY_BANDS ||--|| WM_PAY_GRADES : "crosswalks to"

  CAREER_GROUPS {
    string career_group_code PK "4-digit e.g. 19030"
    string career_group_name "e.g. Financial Services"
    string occupational_family "e.g. Administrative Services"
    string occ_family_code "2-digit e.g. 19"
    int pay_band_min "lowest band in group"
    int pay_band_max "highest band in group"
    text concept_of_work "full narrative"
    string source_url "DHRM page URL"
    string source_format "html or pdf"
    date effective_date "11/01/01 for most"
  }

  ROLES {
    string role_code PK "5-digit e.g. 19036"
    string role_name "e.g. Financial Services Manager III"
    string career_group_code FK "4-digit parent"
    int pay_band "single band number"
    string track "practitioner or management"
    text complexity "compensable factor text"
    text results "compensable factor text"
    text accountability "compensable factor text"
    text role_summary "intro paragraph"
  }

  HISTORICAL_TITLES {
    int id PK "auto-increment"
    string role_code FK "maps to current role"
    string former_class_code "e.g. 23136"
    string former_class_title "e.g. Assistant Comptroller"
    int former_grade "e.g. 19"
  }

  SOC_CODES {
    int id PK "auto-increment"
    string career_group_code FK "parent group"
    string soc_code "e.g. 13-2010"
    string soc_title "e.g. Accountants and Auditors"
  }

  DHRM_PAY_BANDS {
    int pay_band PK "1 through 10"
    float annual_min "FY26 minimum"
    float annual_midpoint "FY26 midpoint"
    float annual_max "FY26 maximum"
    float hourly_min "if applicable"
    float hourly_max "if applicable"
    date effective_date "6/10/2025"
  }

  WM_PAY_GRADES {
    string pay_grade PK "e.g. S18 or H08"
    string grade_type "salaried or hourly"
    float annual_min "or hourly_min"
    float annual_midpoint "or hourly_midpoint"
    float annual_max "or hourly_max"
    int mapped_dhrm_band FK "crosswalk link"
    date effective_date "6/10/2025"
  }
`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
