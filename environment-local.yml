# GRIFFIN -- HR Classification Project (local development environment)
# Recreate: conda env create -f environment-local.yml
# Activate: conda activate griffin
#
# This file is named environment-local.yml (not environment.yml) intentionally:
# Streamlit Community Cloud auto-detects environment.yml and uses conda,
# which silently skips pip subsections. The deployed app builds from
# requirements.txt instead. Local notebook development continues to use
# this file for full conda env reproduction.

name: griffin
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # --- Scraping & Parsing ---
  - requests
  - beautifulsoup4
  - lxml

  # --- Data & Database ---
  - pandas
  - sqlalchemy
  - pymysql
  - openpyxl

  # --- Visualization ---
  - streamlit
  - plotly
  - seaborn
  - matplotlib

  # --- ML Explainability ---
  - shap

  # --- Jupyter kernel support ---
  - ipykernel

  # --- Java (required for H2O in Notebook 5) ---
  - openjdk=11

  # --- pip-only packages ---
  - pip:
    - pdfplumber
    - langchain
    - langchain-core
    - langchain-google-genai
    - langgraph
    - google-generativeai
    - python-dotenv
    - scikit-learn
    - h2o
    - numpy
    - polars>=1.0
    - pyarrow>=14.0
    - python-docx>=1.1
